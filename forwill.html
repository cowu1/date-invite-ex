<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Saturday in the 240</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<style>
/* Layout: one-screen night parking-lot scene; car centered under a sodium lamp, invite card overlays on tap */
:root{
  --night:#13161c;      /* sky / page */
  --asphalt:#1d2129;    /* ground */
  --lamp:#f2b45a;       /* sodium lamp glow */
  --ink:#eef0f3;        /* text */
  --muted:#9aa1ad;      /* secondary text */
  --blush:#ff7a9c;      /* accent: the question */
  --card:#1f232c;
  --font-display:"Rubik Mono One", "Arial Black", Impact, sans-serif;
  --font-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  overflow-x:hidden;
}
.scene{
  min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;
  padding-block:32px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(ellipse 60% 45% at 50% 30%, rgba(242,180,90,.18), transparent 70%),
    linear-gradient(to bottom, var(--night) 0%, var(--night) 62%, var(--asphalt) 62%, var(--asphalt) 100%);
  box-sizing:border-box;
}
.eyebrow{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--lamp);margin:0;
}
h1{
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(22px, 5vw, 40px);
  line-height:1.1;margin:0;text-align:center;text-wrap:balance;
}
.hint{color:var(--muted);margin:0;text-align:center;font-size:15px}
.hint b{color:var(--blush);font-weight:600}
.car-wrap{width:100%;max-width:920px}
svg.car{width:100%;height:auto;display:block;overflow:visible}

/* the door handle hotspot */
.handle-hit{cursor:pointer;outline:none}
.handle-hit .ring{
  fill:none;stroke:var(--blush);stroke-width:2.5;opacity:.9;
  transform-box:fill-box;transform-origin:center;
  animation:pulse 1.8s ease-out infinite;
}
.handle-hit .grip{fill:#555a62;stroke:#2c3036;stroke-width:1.5;transition:fill .15s}
.handle-hit:hover .grip,.handle-hit:focus-visible .grip{fill:var(--blush)}
.handle-hit:focus-visible .focus{stroke:var(--ink);stroke-width:2;fill:none}
.handle-hit .focus{stroke:none}
.handle-hit:active .grip{transform:translateX(3px)}
@keyframes pulse{
  0%{transform:scale(.7);opacity:.95}
  100%{transform:scale(1.6);opacity:0}
}
.plate-text{font-family:var(--font-display);font-size:9px;fill:#1a1d22}

/* overlay card */
.overlay{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:rgba(8,10,14,.72);
  backdrop-filter:blur(3px);
}
.card{
  background:var(--card);
  border:1px solid rgba(255,122,156,.35);
  border-radius:18px;
  padding:32px 28px 28px;
  max-width:420px;width:100%;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:pop .35s cubic-bezier(.2,1.4,.4,1);
  box-sizing:border-box;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{
  font-family:var(--font-display);font-weight:400;
  font-size:clamp(20px,5.4vw,26px);line-height:1.25;margin:0 0 8px;
  color:var(--blush);text-wrap:balance;
}
.card p{color:var(--muted);margin:0 0 24px;line-height:1.5}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{
  font-family:var(--font-body);font-weight:600;font-size:17px;
  border-radius:999px;padding:12px 30px;cursor:pointer;border:2px solid transparent;
  transition:transform .12s;
}
button:hover{transform:translateY(-2px)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.yes{background:var(--blush);color:#2a0b14}
.no{background:transparent;color:var(--ink);border-color:#4a505c}
.close{background:transparent;color:var(--muted);font-size:14px;padding:8px 16px;margin-top:4px}

#hearts{position:fixed;inset:0;pointer-events:none;z-index:30}

@media (prefers-reduced-motion: reduce){
  .handle-hit .ring{animation:none;opacity:.8}
  .card{animation:none}
}
</style>

<main class="scene">
  <p class="eyebrow">Hey Willard</p>
  <h1>Got a question for you</h1>
  <p class="hint">Tap the <b>door handle</b> to open it</p>

  <div class="car-wrap">
    <svg class="car" viewBox="40 90 820 240" role="img" aria-label="Drawing of a gray 1998 Nissan 240SX coupe with a pig-nose front lip">
      <defs>
        <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b3b8be"/>
          <stop offset=".45" stop-color="#8e949b"/>
          <stop offset="1" stop-color="#5d6268"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3a4250"/>
          <stop offset="1" stop-color="#191d24"/>
        </linearGradient>
        <radialGradient id="shadow">
          <stop offset="0" stop-color="#000" stop-opacity=".6"/>
          <stop offset="1" stop-color="#000" stop-opacity="0"/>
        </radialGradient>
        <g id="wheel">
          <circle r="52" fill="#141619"/>
          <circle r="49" fill="none" stroke="#2a2d32" stroke-width="2"/>
          <circle r="36" fill="#a9aeb4"/>
          <circle r="32" fill="#7c8188"/>
          <g fill="#c8ccd1">
            <rect x="-4" y="-31" width="8" height="26" rx="3"/>
            <rect x="-4" y="-31" width="8" height="26" rx="3" transform="rotate(72)"/>
            <rect x="-4" y="-31" width="8" height="26" rx="3" transform="rotate(144)"/>
            <rect x="-4" y="-31" width="8" height="26" rx="3" transform="rotate(216)"/>
            <rect x="-4" y="-31" width="8" height="26" rx="3" transform="rotate(288)"/>
          </g>
          <circle r="8" fill="#4a4f56"/>
        </g>
      </defs>

      <!-- ground shadow -->
      <ellipse cx="450" cy="318" rx="400" ry="16" fill="url(#shadow)"/>

      <!-- wheel wells -->
      <circle cx="210" cy="276" r="58" fill="#0d0f12"/>
      <circle cx="680" cy="276" r="58" fill="#0d0f12"/>

      <!-- body -->
      <path fill="url(#paint)" stroke="#3c4046" stroke-width="2" d="
        M 86 236
        C 78 244, 76 256, 82 266
        L 150 274
        A 62 62 0 0 1 270 274
        L 618 274
        A 62 62 0 0 1 742 274
        L 812 270
        C 830 266, 838 250, 834 232
        L 830 206
        C 822 196, 792 190, 760 188
        L 700 186
        C 660 176, 600 138, 560 127
        C 520 119, 440 117, 402 123
        C 372 129, 332 158, 300 182
        C 250 191, 160 201, 118 211
        C 98 217, 90 226, 86 236 Z"/>

      <!-- shoulder highlight -->
      <path d="M 130 214 C 200 204, 260 196, 300 190 L 700 192 C 750 194, 800 198, 826 210" fill="none" stroke="#d6dade" stroke-width="2" opacity=".55"/>

      <!-- greenhouse / windows -->
      <path fill="url(#glass)" stroke="#2a2e34" stroke-width="2" d="
        M 318 182
        C 345 160, 378 137, 406 131
        C 440 126, 515 127, 553 134
        C 588 146, 626 168, 664 185 Z"/>
      <!-- B-pillar -->
      <path d="M 520 130 L 536 185" stroke="#3c4046" stroke-width="7"/>
      <!-- window reflection -->
      <path d="M 350 172 L 392 140 L 410 140 L 370 172 Z" fill="#fff" opacity=".08"/>

      <!-- door seams -->
      <path d="M 304 188 L 312 268 M 312 268 L 524 268 L 528 186" fill="none" stroke="#4a4e55" stroke-width="2"/>
      <!-- body side crease -->
      <path d="M 120 236 L 820 228" stroke="#6d7279" stroke-width="1.5" opacity=".7"/>

      <!-- side mirror -->
      <path d="M 318 182 C 312 172, 330 166, 340 170 L 342 182 Z" fill="#7d8289" stroke="#3c4046" stroke-width="1.5"/>

      <!-- headlight (kouki projector style) -->
      <path d="M 96 224 L 146 212 L 156 220 L 104 233 Z" fill="#dfe6ee" stroke="#3c4046" stroke-width="1.5"/>
      <circle cx="132" cy="219" r="4" fill="#9fb3c8"/>
      <!-- turn signal / bumper intake -->
      <path d="M 90 248 L 130 250 L 128 258 L 92 257 Z" fill="#2b2f35"/>
      <!-- taillight -->
      <path d="M 810 200 L 830 206 L 833 224 L 814 220 Z" fill="#c3243a" stroke="#3c4046" stroke-width="1.5"/>
      <!-- rear spoiler -->
      <path d="M 742 186 L 800 184 L 806 178 L 752 180 Z" fill="#6b7076" stroke="#3c4046" stroke-width="1.5"/>

      <!-- pig nose front lip -->
      <path d="M 70 262 C 56 270, 62 286, 92 289 C 120 291, 150 287, 172 280 L 150 274 L 82 266 Z" fill="#4a4f56" stroke="#2c3036" stroke-width="2"/>
      <ellipse cx="96" cy="279" rx="8" ry="4.5" fill="#121417"/>
      <ellipse cx="124" cy="280" rx="8" ry="4.5" fill="#121417"/>

      <!-- side skirt -->
      <path d="M 272 274 L 616 274 L 612 282 L 276 282 Z" fill="#4a4f56"/>

      <!-- wheels -->
      <use href="#wheel" x="210" y="276"/>
      <use href="#wheel" x="680" y="276"/>

      <!-- door handle (interactive) -->
      <g class="handle-hit" id="handle" tabindex="0" role="button" aria-label="Open the door">
        <rect x="470" y="190" width="56" height="34" fill="transparent"/>
        <rect class="focus" x="476" y="196" width="44" height="22" rx="6"/>
        <circle class="ring" cx="498" cy="207" r="16"/>
        <rect class="grip" x="483" y="202" width="30" height="9" rx="4"/>
      </g>
    </svg>
  </div>
</main>

<div class="overlay" id="ask" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">Will you go on a date with me this Saturday?</h2>
    <div class="btns">
      <button class="yes" id="yesBtn">Yes</button>
      <button class="no" id="noBtn">No</button>
    </div>
  </div>
</div>

<div class="overlay" id="answer" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ansTitle">
    <h2 id="ansTitle"></h2>
    <p id="ansText"></p>
    <div class="btns"><button class="close" id="closeBtn">Close</button></div>
  </div>
</div>

<canvas id="hearts"></canvas>

<script>
(function(){
  const handle = document.getElementById('handle');
  const ask = document.getElementById('ask');
  const answer = document.getElementById('answer');
  const ansTitle = document.getElementById('ansTitle');
  const ansText = document.getElementById('ansText');

  function openAsk(){
    answer.hidden = true;
    ask.hidden = false;
    document.getElementById('yesBtn').focus();
  }
  handle.addEventListener('click', openAsk);
  handle.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAsk(); }
  });

  function showAnswer(title, text){
    ask.hidden = true;
    ansTitle.textContent = title;
    ansText.textContent = text;
    answer.hidden = false;
    document.getElementById('closeBtn').focus();
  }

  document.getElementById('yesBtn').addEventListener('click', () => {
    showAnswer('It’s a date!', 'Wear hiking clothes.');
    hearts();
  });
  document.getElementById('noBtn').addEventListener('click', () => {
    showAnswer('Too bad, you’re coming!', '');
  });
  document.getElementById('closeBtn').addEventListener('click', () => {
    answer.hidden = true; handle.focus();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { ask.hidden = true; answer.hidden = true; }
  });

  // falling hearts on "Yes"
  function hearts(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('hearts');
    const ctx = c.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    ctx.scale(dpr, dpr);
    const colors = ['#ff7a9c','#ffb3c4','#f2b45a','#ffffff'];
    const parts = Array.from({length: 70}, () => ({
      x: Math.random() * innerWidth,
      y: -20 - Math.random() * innerHeight * .6,
      s: 8 + Math.random() * 12,
      v: 1.5 + Math.random() * 2.5,
      sway: Math.random() * Math.PI * 2,
      col: colors[Math.floor(Math.random() * colors.length)]
    }));
    function heart(x, y, s, col){
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(x, y + s * .3);
      ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
      ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
      ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
      ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3);
      ctx.fill();
    }
    let frames = 0;
    (function tick(){
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let alive = false;
      parts.forEach(p => {
        p.y += p.v; p.sway += .05;
        if (p.y < innerHeight + 30) alive = true;
        heart(p.x + Math.sin(p.sway) * 10, p.y, p.s, p.col);
      });
      if (alive && ++frames < 900) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })();
  }
})();
</script>

</body></html>
